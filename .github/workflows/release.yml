name: Release

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Decide the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git log -1 --format='%(trailers:key=Release-Tag,valueonly)' "$GITHUB_SHA" | head -n 1 | tr -d '[:space:]')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No Release-Tag trailer on the head commit; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.plan.outputs.skip == 'false'
        run: JAVA_TOOL_OPTIONS='-Duser.language=en -Duser.country=US' mvn -B clean package

      - name: Publish the release
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          else
            git log -1 --format='%b' "$GITHUB_SHA" | grep -v '^Release-Tag:' > "$RUNNER_TEMP/notes.md"
          fi
          jar="$(ls target/DynamicShop-*.jar | grep -vE '-(shaded|sources|javadoc).jar$' | head -n 1)"
          gh release create "$TAG" "$jar" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
