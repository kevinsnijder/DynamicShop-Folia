name: Merge upstream

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/selfservice0/DynamicShop.git
          git config remote.upstream.tagOpt --no-tags
          git fetch --quiet upstream main
          git log --format='- %s (%h)' HEAD..upstream/main > "$RUNNER_TEMP/upstream.txt"
          if [ ! -s "$RUNNER_TEMP/upstream.txt" ]; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Upstream has no new commits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git merge --no-ff --no-edit -m "Merge upstream DynamicShop main" upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly upstream merge stopped on merge conflicts; main was not changed."
            echo
            echo "### Conflicting files"
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "### New upstream commits"
            cat "$RUNNER_TEMP/upstream.txt"
            echo
            echo "Resolve them with the Folia rules (Minecraft/economy/CLAUDE.md), push main with a \`Release-Tag: <version>-folia[-updateN]\` trailer on the last commit, and close this issue."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
          title="Upstream merge needs conflict resolution"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          { if [ -n "$number" ]; then gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"; else gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"; fi; } || echo "Could not open an issue; the details are in the run summary."
          exit 1

      - name: Check the Folia rules
        if: steps.merge.outputs.result == 'merged'
        run: |
          bad="$(grep -rnE 'getScheduler\(\)|BukkitRunnable|BukkitTask|callSyncMethod|\.runTask(Later|Timer|Asynchronously|LaterAsynchronously|TimerAsynchronously)?\(' src/main/java --include=*.java | grep -v 'util/FoliaScheduler.java' || true)"
          if [ -n "$bad" ]; then
            echo "Bukkit scheduler use outside FoliaScheduler:"
            echo "$bad"
            exit 1
          fi
          grep -q '^folia-supported: true' src/main/resources/plugin.yml || { echo "plugin.yml lost folia-supported: true"; exit 1; }

      - name: Rebuild the website bundle
        if: steps.merge.outputs.result == 'merged'
        run: |
          node --test web-src/checks/*.test.cjs
          node web-src/build.cjs
          git add src/main/resources/web
          git diff --cached --quiet || git commit -m "Regenerate the website bundle after the upstream merge" -m "Validation: node --test web-src/checks passes."

      - name: Build and test
        if: steps.merge.outputs.result == 'merged'
        run: JAVA_TOOL_OPTIONS='-Duser.language=en -Duser.country=US' mvn -B clean package

      - name: Push and release
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if ! gh release view "$version-folia" >/dev/null 2>&1 && ! git rev-parse -q --verify "refs/tags/$version-folia" >/dev/null; then
            tag="$version-folia"
          else
            n="$(git tag -l "$version-folia-update*" | sed -E 's/.*-update([0-9]+)$/\1/' | sort -n | tail -n 1)"
            tag="$version-folia-update$(( ${n:-0} + 1 ))"
          fi
          tests="$(cat target/surefire-reports/*.txt 2>/dev/null | grep -oE 'Tests run: [0-9]+' | awk '{s+=$3} END {print s+0}')"
          {
            echo "Folia/Canvas build of [DynamicShop](https://github.com/selfservice0/DynamicShop) $version with the upstream changes below merged in."
            echo
            echo "### Folia changes"
            echo "Region-safe scheduling through FoliaScheduler, synchronized stock and money changes, thread-safe per-player state, no ProtocolLib, plus the fork's own features (stock decay, buy floor, whole coins, web coin icon, hidden sell-only items, item order from config.yml)."
            echo
            echo "### From the original"
            cat "$RUNNER_TEMP/upstream.txt"
            echo
            echo "### Tested"
            echo "$tests unit tests pass. Merged and released automatically; not tested in-game."
          } > "$RUNNER_TEMP/notes.md"
          git push origin HEAD:main
          gh release create "$tag" "target/DynamicShop-$version.jar" --target "$(git rev-parse HEAD)" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed merge
        if: failure() && steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream merge failed the Folia check, website check or tests"
          body="The weekly upstream merge succeeded without conflicts, but a later check failed, so main was not changed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          { if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi; } || echo "Could not open an issue."
